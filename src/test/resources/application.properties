# Konfigurasi khusus untuk Test (JUnit / SpringBootTest)
spring.datasource.url=jdbc:postgresql://localhost:5432/logbook_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# File ini menggantikan application.properties utama di classpath test,
# jadi pengaturan cookie sesi harus dideklarasikan ulang di sini.
server.servlet.session.cookie.name=LOGBOOK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
