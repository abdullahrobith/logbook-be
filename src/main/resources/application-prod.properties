# Konfigurasi sesi untuk production (HTTPS di balik reverse proxy / load balancer).
# Aktifkan dengan: --spring.profiles.active=prod
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Reverse proxy yang menghentikan TLS harus meneruskan header X-Forwarded-*,
# supaya aplikasi mengenali request sebagai HTTPS saat membentuk cookie/redirect.
server.forward-headers-strategy=framework

# Hanya percaya X-Forwarded-For/X-Real-IP bila reverse proxy tepercaya yang
# menimpanya. Jika tidak, klien dapat memalsukan IP untuk menghindari rate limit.
logbook.rate-limit.trust-forwarded-headers=true

# AuthController tidak mengirim devToken ketika profil prod aktif; token reset
# hanya tersimpan sebagai hash di database dan tidak pernah dicatat ke log.

# Produksi tidak boleh auto-repair: perubahan migrasi harus terdeteksi.
logbook.flyway.repair-checksums=false
