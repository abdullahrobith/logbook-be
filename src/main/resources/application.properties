spring.application.name=logbook-be

spring.datasource.url=jdbc:postgresql://localhost:5433/logbook
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

# SQL dicatat lewat pipeline SLF4J/Logback (JSON, timestamp, requestId,
# masuk application.log) alih-alih dicetak langsung ke console oleh show-sql.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG

# Database lama sudah memiliki skema dari logbook.sql; Flyway mencatat baseline lalu
# menjalankan migrasi yang belum tercatat saat aplikasi dimulai.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Batas hari: Daily Log yang boleh ditambah, diubah, atau dikirim adalah milik
# hari aktif pengguna. Hari yang sudah lewat maupun yang belum tiba terkunci.
# Deadline tanggal D adalah pukul 23:59 D menurut zona waktu di bawah ini,
# kecuali pengguna shift malam (work_end < work_start): deadline-nya work_end
# pada D+1. Jam kerja per pengguna dibaca dari user_settings.
logbook.batas-hari.aktif=true
logbook.zona-waktu=Asia/Jakarta

# Saran sebelum pengiriman (LBK-KUA-02): peringatan ringkasan terlalu pendek
# atau durasi task terlalu panjang.
logbook.saran.ringkasan-min=20
logbook.saran.task-maks-menit=240

# Tugas berkala (setiap 15 menit) mengirim Draf yang lewat batas hari dan
# menandai hari kerja tanpa isi sebagai TERLEWAT. Dimatikan dengan
# logbook.jadwal.aktif=false; jadwal dapat diubah lewat ekspresi cron.
logbook.jadwal.aktif=true
logbook.jadwal.cron=0 */15 * * * *
# Penandaan TERLEWAT paling jauh sekian hari ke belakang. Libur nasional,
# cuti, akhir pekan, dan akun admin tidak pernah ditandai TERLEWAT.
logbook.terlewat.hari-ke-belakang=31

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.cookie.name=LOGBOOK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.timeout=8h