spring.application.name=logbook-be

spring.datasource.url=jdbc:postgresql://localhost:5432/logbook
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

# SQL dicatat lewat pipeline SLF4J/Logback (JSON, timestamp, requestId,
# masuk application.log) alih-alih dicetak langsung ke console oleh show-sql.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG

# Database lama sudah memiliki skema dari logbook.sql; Flyway mencatat baseline lalu
# menjalankan migrasi yang belum tercatat saat aplikasi dimulai.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.cookie.name=LOGBOOK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=8h
